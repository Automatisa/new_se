# Sentora Apache Include file
# Written by Bobby Allen, 15/05/2011
# Adaptado para FreeBSD + Apache 2.4 + PHP-FPM
 
# Set the Sentora Alias (used for development, sable will eventually use a VHOST)
#Alias /Sentora /usr/local/sentora
 
# Set a default server name for the master configuration to supress Apache daemon warnings
ServerName localhost
 
# Setup the directory settings and PHP security flags for the Sentora application directory.
<Directory /usr/local/sentora>
    Options +FollowSymLinks
    DirectoryIndex index.php index.html
 
    # PHP-FPM via mod_proxy_fcgi (PHP 8.4, FreeBSD)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php-fpm/www.sock|fcgi://localhost/"
    </FilesMatch>
</Directory>
 
# Disallow web access to directories that don't need it/that we don't want people looking in!
<Directory /usr/local/sentora/cnf/>
    Require all denied
</Directory>
<Directory /usr/local/sentora/modules/*/hooks>
    Require all denied
</Directory>
 
# Set server tokens
ServerTokens Prod

# ---- SSL / puerto 443 ----
# Listen 443 + vhost SSL por defecto con el cert autofirmado del panel (lo genera
# el instalador). Necesario para que Apache escuche en 443 desde el inicio: sin
# esto el modulo Sencrypt avisa "Port 443 CLOSED" y no se pueden emitir certs.
# Los vhosts SSL por dominio (Let's Encrypt) los anade el daemon a *:443.
Listen 443
<VirtualHost _default_:443>
    ServerName localhost
    DocumentRoot "/usr/local/sentora/"
    SSLEngine on
    SSLCertificateFile    "/usr/local/etc/sentora/apache/ssl/panel.crt"
    SSLCertificateKeyFile "/usr/local/etc/sentora/apache/ssl/panel.key"
    <Directory "/usr/local/sentora/">
        Options +FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>

# Now we include the generic VHOST configuration file that holds all Sentora user hosted vhost data
Include /usr/local/etc/sentora/apache/httpd-vhosts.conf
