controls {
    inet 127.0.0.1 port 953
        allow { 127.0.0.1; }
        keys { "rndc-key"; };
};

acl trusted-servers {
    !SERVER_IP!;
};

options {
    directory "/usr/local/etc/namedb";

    listen-on port 53 { any; };
    listen-on-v6 { any; };

    allow-query { any; };
    recursion no;

    dump-file "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";

    dnssec-validation auto;

    auth-nxdomain no;

    allow-transfer { none; };
};

logging {

    channel bind_log {
        file "/var/sentora/logs/bind/bind.log"
            versions 3 size 2m;
        severity notice;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel default_debug {
        file "/var/sentora/logs/bind/debug.log";
        severity dynamic;
    };

    category default {
        bind_log;
    };
};

include "/usr/local/etc/namedb/zones.rfc1918";
include "/usr/local/etc/sentora/bind/etc/named.conf";
