# Sentora DNS Configuration for FreeBSD


include "/usr/local/etc/sentora/bind/rndc.key";

controls {
    inet 127.0.0.1 port 953
    allow { 127.0.0.1; } keys { "rndc-key"; };
};

options {
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    allow-query { any; };
    directory "/usr/local/etc/sentora/bind";
    dump-file "/usr/local/etc/sentora/bind/data/cache_dump.db";
    statistics-file "/usr/local/etc/sentora/bind/data/named_stats.txt";
    memstatistics-file "/usr/local/etc/sentora/bind/data/named_mem_stats.txt";
    recursion no;
    max-cache-size 256M;
    pid-file "/var/run/named/pid";
    version "not currently available";


    dnssec-validation yes;

};

logging {
    channel bind_log {
        file "/var/sentora/logs/bind/bind.log" versions 3 size 2m;
        severity notice;
        print-severity yes;
        print-time yes;
        print-category yes;
    };

    channel default_debug {
        file "/var/sentora/logs/bind/debug.log";
        severity dynamic;
    };

    category default {
        bind_log;
    };
};

include "/usr/local/etc/sentora/bind/zones.conf";
